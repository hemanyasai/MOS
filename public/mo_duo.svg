<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140">
  <!-- Bear (pastel, left) -->
  <g>
    <!-- Ears -->
    <circle cx="47" cy="26" r="16" fill="#e8c9a0" stroke="#b07a45" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="93" cy="26" r="16" fill="#e8c9a0" stroke="#b07a45" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner ears -->
    <circle cx="47" cy="26" r="9" fill="#e8c9a0" stroke="#b07a45" stroke-width="1.2" opacity="0.55"/>
    <circle cx="93" cy="26" r="9" fill="#e8c9a0" stroke="#b07a45" stroke-width="1.2" opacity="0.55"/>
    <!-- Head -->
    <rect x="30" y="22" width="80" height="74" rx="32" fill="#e8c9a0" stroke="#b07a45" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Eyes -->
    <circle cx="55" cy="57" r="5.5" fill="#b07a45"/>
    <circle cx="85" cy="57" r="5.5" fill="#b07a45"/>
    <!-- Eye shine -->
    <circle cx="57" cy="55" r="1.8" fill="#f9f6ef" opacity="0.7"/>
    <circle cx="87" cy="55" r="1.8" fill="#f9f6ef" opacity="0.7"/>
    <!-- Blush -->
    <circle cx="44" cy="72" r="7" fill="#e8a0b0" opacity="0.8"/>
    <circle cx="96" cy="72" r="7" fill="#e8a0b0" opacity="0.8"/>
    <!-- Mouth happy -->
    <path d="M60 73q10 11 20 0" fill="none" stroke="#b07a45" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Label -->
    <text x="70" y="112" font-family="Baloo 2, cursive" font-size="10" fill="#b07a45" text-anchor="middle" font-weight="600">pastel</text>
  </g>

  <!-- Robot (scifi, right) -->
  <g transform="translate(140, 0)">
    <!-- Antenna -->
    <line x1="60" y1="8" x2="60" y2="22" stroke="#5ef0d8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="8" r="4.5" fill="#5ef0d8"/>
    <!-- Hex body -->
    <path d="M60 22 92 40v32L60 90 28 72V40z" fill="#1e2f48" stroke="#5ef0d8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner panel -->
    <path d="M60 30 86 45v26L60 82 34 71V45z" fill="#1e2f48" stroke="#5ef0d8" stroke-width="1" stroke-linejoin="round" opacity="0.5"/>
    <!-- Eyes happy -->
    <path d="M40 58q6-8 13 0" fill="none" stroke="#5ef0d8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M67 58q6-8 13 0" fill="none" stroke="#5ef0d8" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M48 73q12 9 24 0" fill="none" stroke="#5ef0d8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Circuit dots -->
    <circle cx="32" cy="55" r="2" fill="#5ef0d8" opacity="0.6"/>
    <circle cx="88" cy="55" r="2" fill="#5ef0d8" opacity="0.6"/>
    <!-- Label -->
    <text x="60" y="112" font-family="Space Grotesk, sans-serif" font-size="10" fill="#5ef0d8" text-anchor="middle" font-weight="600" letter-spacing="1">SCIFI</text>
  </g>
</svg>
